name: ai-triage-gate
on:
  pull_request_review:
    types:
      - submitted
jobs:
  gate:
    runs-on: ubuntu-latest
    permissions: {}
    if: github.event.review.state == 'approved' && contains(fromJSON('["moltar"]'), github.event.review.user.login) && !github.event.pull_request.draft
    steps:
      - name: Save the pull request number
        id: save_the_pull_request_number
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |-
          mkdir -p /tmp/ai-triage-gate
          echo "$PR_NUMBER" > /tmp/ai-triage-gate/pr-number.txt
      - name: Upload the gate artifact
        id: upload_the_gate_artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ai-triage-gate
          path: /tmp/ai-triage-gate
          retention-days: 1
