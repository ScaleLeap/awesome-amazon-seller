# ~~ Generated by projen. To modify, edit .projenrc.ts and run "npx projen".

name: ci
on:
  pull_request: {}
  push:
    branches:
      - master
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        id: check_out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up pnpm
        id: set_up_pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - name: Set up Node.js
        id: set_up_node_js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        id: install_dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        id: build
        run: pnpm exec projen build
      - name: Check that the generated files are up to date
        id: check_that_the_generated_files_are_up_to_date
        run: |-
          git add --all
          git diff --staged --exit-code || {
            echo '::error::The generated files are out of date. Run "npx projen", then commit all changed files.'
            exit 1
          }
