# ~~ Generated by projen. To modify, edit .projenrc.ts and run "npx projen".

name: dead-links
on:
  schedule:
    - cron: 0 6 * * 1
  workflow_dispatch: {}
jobs:
  dead-links:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out
        id: check_out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up pnpm
        id: set_up_pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - name: Set up Node.js
        id: set_up_node_js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        id: install_dependencies
        run: pnpm install --frozen-lockfile
      - name: List the URLs
        id: list_the_urls
        run: npx projen@0.104.17 dead-links:urls
      - name: Check the links
        id: check_the_links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8
        with:
          args: --no-progress --accept '200..=299,403,429,999' --max-retries 2 --timeout 30 --user-agent 'Mozilla/5.0 (Macintosh; Intel Mac OS X 14_0) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36' /tmp/dead-links/urls.txt
          format: json
          output: /tmp/dead-links/lychee.json
          fail: false
          jobSummary: true
      - name: Update the link health
        id: update_the_link_health
        run: npx projen@0.104.17 dead-links:apply
      - name: Update the readme
        id: update_the_readme
        run: npx projen@0.104.17 default
      - name: Open the pull request
        id: open_the_pull_request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          branch: bot/dead-links
          delete-branch: true
          commit-message: "fix: update the link health and remove dead links"
          title: Remove dead links
          body-path: /tmp/dead-links/summary.md
          add-paths: |-
            data/entries
            data/link-health.json
            readme.md
