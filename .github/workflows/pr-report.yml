# ~~ Generated by projen. To modify, edit .projenrc.ts and run "npx projen".

name: pr-report
on:
  workflow_run:
    workflows:
      - build
    types:
      - completed
jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    if: github.event.workflow_run.event == 'pull_request' && (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure')
    steps:
      - name: Check out
        id: check_out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js
        id: set_up_node_js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - name: Download the report artifact
        id: download_the_report_artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: pr-report
          path: /tmp/pr-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Find the pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |-
          number=$(gh api "repos/$REPO/pulls?state=open&head=$HEAD_OWNER:$HEAD_BRANCH" --jq ".[] | select(.head.sha == \"$HEAD_SHA\") | .number")
          if [ -z "$number" ]; then
            echo "::notice::No open pull request has the commit $HEAD_SHA. A newer commit replaced it, or the pull request is closed."
            exit 0
          fi
          if [ "$number" != "$(cat /tmp/pr-report/pr-number.txt)" ]; then
            echo "::error::The pull request number in the artifact does not agree with pull request $number."
            exit 1
          fi
          gh api "repos/$REPO/pulls/$number/files" --paginate --jq '.[] | select(.status != "removed") | .filename' > /tmp/pr-report/changed.txt
          added=$(gh api "repos/$REPO/pulls/$number/files" --paginate --jq '.[] | select(.status == "added" and (.filename | startswith("data/entries/"))) | .filename' | wc -l | tr -d ' ')
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "added=$added" >> "$GITHUB_OUTPUT"
      - name: Render the report
        id: report
        if: steps.pr.outputs.number
        env:
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node projenrc/report/cli.ts --findings /tmp/pr-report/findings.json --conclusion "$CONCLUSION" --run-url "$RUN_URL" --head-sha "$HEAD_SHA" --out /tmp/pr-report/report.md --changed /tmp/pr-report/changed.txt --entries-path data/entries
      - name: Post the report
        id: post_the_report
        if: steps.pr.outputs.number
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88
        with:
          header: pr-report
          number: ${{ steps.pr.outputs.number }}
          path: /tmp/pr-report/report.md
      - name: Set the labels
        id: set_the_labels
        if: steps.pr.outputs.number
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ steps.pr.outputs.number }}
          STATUS: ${{ steps.report.outputs.status }}
          ADDED: ${{ steps.pr.outputs.added }}
        run: |-
          gh label create "ready" --color "0e8a16" --description "The list check passed" --force
          gh label create "needs-changes" --color "d93f0b" --description "The list check found problems" --force
          gh label create "new-entry" --color "1d76db" --description "Adds an entry to the list" --force
          if [ "$STATUS" = "ready" ]; then
            gh pr edit "$NUMBER" --add-label "ready" --remove-label "needs-changes"
          else
            gh pr edit "$NUMBER" --add-label "needs-changes" --remove-label "ready"
          fi
          if [ "$ADDED" != "0" ]; then
            gh pr edit "$NUMBER" --add-label "new-entry"
          fi
