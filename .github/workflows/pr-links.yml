name: pr-links
on:
  pull_request:
    paths:
      - data/entries/**
jobs:
  links:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        id: check_out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Find the URLs of the changed entries
        id: urls
        run: |-
          files=$(git diff --name-only --diff-filter=AM "origin/$GITHUB_BASE_REF...HEAD" -- "data/entries")
          if [ -n "$files" ]; then grep -ohE 'https?://[^"]+' $files | sort -u > urls.txt; else : > urls.txt; fi
          cat urls.txt
          echo "count=$(wc -l < urls.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"
      - name: Check the links
        id: check_the_links
        if: steps.urls.outputs.count != '0'
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8
        with:
          args: --no-progress --accept '200..=299,403,429,999' --max-retries 2 --timeout 30 --user-agent 'Mozilla/5.0 (Macintosh; Intel Mac OS X 14_0) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36' urls.txt
          fail: true
          jobSummary: true
